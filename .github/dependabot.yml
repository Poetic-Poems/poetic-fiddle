version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # jsdom is pinned to 26.x: 27+ pulls in the ESM-only @exodus/bytes via
      # html-encoding-sniffer@6, which 500s /share/<id> at runtime on Vercel
      # (ERR_REQUIRE_ESM under Turbopack's server build). See TECH-DEBT.md
      # TD26071901 and issue #86 before lifting this.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      # typescript is held at 6.x (`^6.0.3`): the typescript-eslint that
      # eslint-config-next pulls in declares a `typescript` peer range of
      # `>=4.8.4 <6.1.0` and refuses to run at all above it, so any bump past
      # 6.0.x breaks `npm run lint`. See tech-debt/TD-PPpfid-26072429.md
      # before lifting this.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
