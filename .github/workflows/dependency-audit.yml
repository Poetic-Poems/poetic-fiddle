name: Dependency audit

# Catches a high-severity advisory published while no pull request happens to
# be open to run ci.yml's `audit` job. Runs the same `npm run audit` gate
# weekly, on a schedule, and files a deduplicated issue on failure.

on:
  schedule:
    - cron: "34 5 * * 1" # weekly, Monday 05:34 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Update npm
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      # continue-on-error records the verdict in `outcome` without ending the
      # job, so the two steps below key off the audit itself rather than off
      # `failure()` — which would also fire when the checkout, the toolchain
      # setup or `npm ci` broke, filing an advisory report for what was really
      # an infrastructure flake.
      #
      # Not retried, for the same reason as ci.yml's own `audit` job: this
      # gate fails false-green rather than false-red, and a retry-until-pass
      # loop would only help a spurious clean result win. The guard is inside
      # `npm run audit` (scripts/check-dependency-audit.mjs), which fails the
      # run when the advisory endpoint returns nothing — reaching
      # `continue-on-error` as a `failure` outcome, so the two steps below
      # still file the issue and fail the job. See TD-PPpfid-26080911.
      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: |
          # Captured separately from the gate's own exit code below, so a
          # filed issue can name the advisory instead of just a run URL. The
          # gate (`npm run audit`) stays the last command in this step, so
          # `steps.audit.outcome` still reflects only its own pass/fail.
          npm audit --json > /tmp/audit.json || true
          npm run audit

      - name: File an issue if the audit failed
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Weekly dependency audit found a high-severity advisory"

          # The gate's owner-authorised exception (see
          # check-dependency-audit.mjs) means an advisory it suppresses never
          # fails the audit — so such an advisory can neither explain this
          # failure nor stand in for it when deduping below. Ask the gate
          # itself whether the exception applied to *this* report rather than
          # repeating its id or its lapse conditions here, so the two cannot
          # drift apart: once the exception lapses, the advisory is a genuine
          # cause again and is reported as one, with no change needed here.
          suppressed_ghsa=$(node -e "
            import('./scripts/check-dependency-audit.mjs').then(async (gate) => {
              const { readFileSync } = await import('node:fs');
              const audit = JSON.parse(readFileSync('/tmp/audit.json', 'utf8'));
              const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
              const { suppressed } = gate.applySuppressedAdvisoryException(audit, lock);
              if (suppressed.length > 0) console.log(gate.SUPPRESSED_ADVISORY_GHSA);
            });
          " 2>/dev/null || true)

          # Only a `via` entry that is itself an advisory object (not a bare
          # package-name string naming another package in the chain) names a
          # real GHSA id — see check-dependency-audit.mjs's own
          # isSuppressedAdvisoryEntry for the same distinction.
          advisories=""
          if [ -s /tmp/audit.json ]; then
            advisories=$(jq -r --arg suppressed "$suppressed_ghsa" '
              (.vulnerabilities // {}) as $vulns
              | [
                  $vulns | to_entries[]
                  | select(.value.severity == "high" or .value.severity == "critical")
                  | .key as $pkg
                  | (.value.via[]? | select(type == "object") | .url
                     | capture("(?<id>GHSA-[A-Za-z0-9-]+)$").id) as $id
                  | select($suppressed == "" or $id != $suppressed)
                  | "\($id) (\($pkg))"
                ]
              | unique
              | .[]
            ' /tmp/audit.json 2>/dev/null || true)
          fi

          # Dedup per advisory rather than over the report as a whole: drop
          # the advisories an open issue already covers, and still file
          # whatever is left, so one long-lived report cannot mask an
          # advisory nobody has seen yet. Open issues only — once a report is
          # resolved and closed, a fresh occurrence is news again.
          #
          # An unreachable search API reads as "not tracked", erring towards
          # filing a possible duplicate rather than towards silence.
          if [ -n "$advisories" ]; then
            untracked_file=$(mktemp)
            while IFS= read -r advisory; do
              ghsa_id=${advisory%% *}
              hit=$(gh issue list --state open --search "$ghsa_id in:title,body" \
                --json number --jq 'length > 0' || echo false)
              if [ "$hit" = "true" ]; then
                echo "Already tracked in an open issue: $advisory"
              else
                printf '%s\n' "$advisory" >> "$untracked_file"
              fi
            done <<< "$advisories"
            advisories=$(cat "$untracked_file")
            rm -f "$untracked_file"
            if [ -z "$advisories" ]; then
              echo "Every advisory in this report is already tracked; skipping."
              exit 0
            fi
            title="Weekly dependency audit: $(printf '%s' "$advisories" \
              | paste -sd, - | sed 's/,/, /g')"
          else
            # No advisory id to key off — the gate failed for a reason the
            # report cannot name (an unusable `npm audit` report, or the
            # canary catching a silent advisory endpoint). Dedup on the fixed
            # title instead, as this step always did.
            already_filed=$(gh issue list --state open --limit 200 --json title \
              | jq --arg title "$title" 'any(.[]; .title == $title)')
            if [ "$already_filed" = "true" ]; then
              echo "Advisory already reported; skipping."
              exit 0
            fi
          fi

          body_file=$(mktemp)
          {
            printf 'The weekly dependency audit (`npm run audit`) failed on '
            printf '`main`.\n'
            if [ -n "$advisories" ]; then
              printf '\nAdvisories found:\n'
              printf '%s\n' "$advisories" | sed 's/^/- /'
            else
              printf '\nRun the audit locally to see the advisory.\n'
            fi
            printf '\nThe run that detected it has the log:\n%s\n' "$RUN_URL"
          } > "$body_file"
          gh issue create --title "$title" --body-file "$body_file"

      - name: Fail if the audit failed
        if: steps.audit.outcome == 'failure'
        run: exit 1
