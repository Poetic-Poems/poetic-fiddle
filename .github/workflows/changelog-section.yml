name: Changelog section check

# Gates the pull-request-description changelog (roadmap decision D27,
# issue #434): a change's changelog entry is a `## Changelog` section of its
# own pull-request description, which the squash merge writes onto `main`,
# and `CHANGELOG.md` is assembled from those descriptions by the release
# pull request alone (see AGENTS.md's "Documentation principles" and
# docs/RELEASE-RUNBOOK.md).
#
# scripts/check-changelog-section.sh decides two things from the title and
# the body: whether the title's Conventional Commits type (`feat`, `fix`,
# `perf`, or any type with the `!` breaking marker) owes a section at all,
# and whether a section that is present has the shape an assembler can read
# — Keep a Changelog's six category sub-headings with `- ` bullets, or the
# single line `None.`.
#
# Deliberately `pull_request` (not `pull_request_target`), so a fork PR never
# runs with write-scoped secrets, and ungated by `paths:` — the body and the
# title can be edited without touching any file, and `edited` is in the
# trigger list for exactly that reason. The body and the title reach the
# script through `env:`, never interpolated into the step, so an
# attacker-controlled title or body from a fork PR cannot inject shell.
#
# Not yet a required status check — see .github/required-checks.yml's
# `exempt:` entry for this job and issue #434 step 7.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # Unfiltered: `merge_group` takes no `branches:` filter, and a merge group's
  # ref is gh-readonly-queue/<base>/…, not the base branch. See ci.yml.
  merge_group:

permissions:
  contents: read

jobs:
  changelog-section:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A merge-group candidate carries no pull request body or title to check,
    # and nothing here changes between the pull_request run that already
    # validated it and the queue picking it up, so this reports skipped
    # rather than re-running with nothing to check — a skipped conclusion
    # still satisfies a required status check.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check the changelog section
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-changelog-section.sh "$PR_BODY" "$PR_TITLE"
