name: Required-checks drift check

# .github/required-checks.yml's `required:` list is a checked-in snapshot of
# the required_status_checks contexts that gate merges into main, read by
# scripts/check-workflow-wiring.mjs (ci.yml's `workflow-wiring` job) so that
# check can run without calling GitHub's API on every pull request. This
# workflow is what keeps that snapshot honest: it re-fetches the live branch
# rules on a schedule and fails if the two have drifted — whether because a
# required check was added or removed on GitHub without updating this file,
# or vice versa (TD-PPpfid-26080105).
#
# The rules/branches/main endpoint aggregates every active ruleset that
# applies to main — there is more than one — so a required check added under
# any of them is seen, with no ruleset ID hardcoded here to go stale if a
# ruleset is ever recreated. The endpoint is readable with the default
# GITHUB_TOKEN's `contents: read` on this public repository; worth recording,
# because the per-ruleset admin endpoints want `administration: read`, which
# is not a permission GITHUB_TOKEN can be granted at all.
#
# Scheduled rather than pull_request-triggered, in the same spirit as
# td-tooling-drift.yml: the branch rules only change when a human deliberately
# edits branch protection, so there's nothing for a per-PR run to catch that
# a weekly one wouldn't, and it avoids the recursive problem of this guard
# itself needing to be wired into required checks.
#
# TD-PPpfid-26080501: a failing run files a deduplicated issue, mirroring
# td-tooling-drift.yml's pattern. On its own a detected drift would be only a
# red run in the Actions tab plus GitHub's default scheduled-failure email,
# and this repository's work is largely dispatched from open issues, so a
# scheduled guard that files nothing is one nobody acts on. That step needs
# `issues: write`, a deliberate widening of this workflow's token permissions
# beyond `contents: read` alone, accepted as the cost of the notification.
# Dedup is against open issues only, unlike a one-off event: drift is a
# recurring condition, so once an open report is resolved and closed, a
# fresh occurrence is news again and should file a new issue.
#
# Unlike check-supabase-auth-drift.mjs, the comparison step below already
# separates "drift detected" from an operational failure — it has nothing
# that fails for a reason other than a genuine snapshot/live disagreement —
# so it follows td-tooling-drift.yml's direct `drifted=` output shape rather
# than supabase-auth-drift.yml's `continue-on-error` + `steps.<id>.outcome`
# shape.

on:
  schedule:
    - cron: "42 6 * * 1" # weekly, Monday 06:42 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Compare required-checks.yml against the live branch rules
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # jq's `unique` rather than `sort`: it de-duplicates a context two
          # rulesets both require (the snapshot lists it once), and it sorts
          # by codepoint — the same order --print-required uses, where the
          # shell's `sort` would collate by locale.
          live=$(gh api repos/${{ github.repository }}/rules/branches/main \
            --jq '[.[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context] | unique | .[]')

          # The same parser the workflow-wiring check itself reads the file
          # with — deliberately not a second grep/sed rendition of it.
          snapshot=$(node scripts/check-workflow-wiring.mjs --print-required)

          if [ "$live" != "$snapshot" ]; then
            echo "::error file=.github/required-checks.yml::required-checks.yml's required: list has drifted from the live branch rules"
            echo "Live required checks (aggregated across every active ruleset on main):"
            echo "$live"
            echo "Checked-in snapshot:"
            echo "$snapshot"
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          else
            echo "required-checks.yml matches the live branch rules:"
            echo "$live"
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: File an issue if drift detected
        if: steps.diff.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="required-checks.yml has drifted from the live branch rules"

          # Dedup on open issues only, unlike check-poetic-release.yml's
          # all-state dedup: a release tag is a one-off event, so once
          # reported it never needs reporting again. Drift is a recurring
          # condition — once an open report is resolved and closed, a fresh
          # occurrence is news again and should file a new issue.
          already_filed=$(gh issue list --state open --limit 200 --json title \
            | jq --arg title "$title" 'any(.[]; .title == $title)')
          if [ "$already_filed" = "true" ]; then
            echo "Drift already reported; skipping."
            exit 0
          fi

          body_file=$(mktemp)
          {
            printf '`.github/required-checks.yml`'"'"'s `required:` list has '
            printf 'drifted from the live branch rules on `main`. Re-sync it '
            printf 'from the aggregated live rules (`node '
            printf 'scripts/check-workflow-wiring.mjs --print-required` '
            printf 'prints the checked-in snapshot for comparison).\n\n'
            printf 'The run that detected this has the diff:\n%s\n' "$RUN_URL"
          } > "$body_file"
          gh issue create --title "$title" --body-file "$body_file"

      - name: Fail if drift detected
        if: steps.diff.outputs.drifted == 'true'
        run: exit 1
