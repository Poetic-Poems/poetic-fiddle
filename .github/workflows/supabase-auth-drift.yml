name: Supabase auth-config drift check

# TD-PPpfid-26080301: supabase/config.toml's [auth] block only ever reaches
# the local Supabase stack `supabase start` brings up for `npm run test:db`
# — the live project's equivalents are dashboard settings that no commit
# here can change, and nothing used to notice when the two disagreed. This
# runs scripts/check-supabase-auth-drift.mjs, which reads the live project's
# auth settings through the Management API and fails when they disagree
# with the committed file.
#
# Assert, not push: the maintainer settled this in
# https://github.com/Poetic-Poems/poetic-fiddle/issues/198#issuecomment-5164921286.
# The dashboard stays authoritative — a red run means a human decides which
# side is right, not that CI overwrites either one. Pushing config.toml as a
# whole was rejected there too: it carries local-stack-only values
# (site_url, redirect URLs, SMTP, OAuth secrets) that must never land on the
# live project, so the script reads and compares only the individually
# reviewed keys in its ALLOWLIST — everything else in config.toml's [auth]
# tree is silently ignored, not merely unreported.
#
# Reuses the existing SUPABASE_ACCESS_TOKEN repository secret rather than
# adding a new one: Supabase personal access tokens cannot be scoped to a
# single project or to read-only, so a second token would only widen the
# credential surface for no gain. That is also why this workflow is
# scheduled/dispatch-only and never `pull_request`-triggered — the same
# discipline ci.yml's `deploy` job (which holds the same token, to push
# migrations) already follows.
#
# Scheduled rather than pull_request-triggered, in the same spirit as
# required-checks-drift.yml: the live project's dashboard settings only
# change when a human deliberately edits them there, so there's nothing for
# a per-PR run to catch that a daily one wouldn't.
#
# TD-PPpfid-26080402: a failing run files a deduplicated issue, mirroring
# td-tooling-drift.yml's pattern. On its own a detected drift would be only
# a red run in the Actions tab plus GitHub's default scheduled-failure
# email, and this repository's work is largely dispatched from open issues,
# so a scheduled guard that files nothing is one nobody acts on. That step
# needs `issues: write`, a deliberate widening of this workflow's token
# permissions beyond `contents: read` alone, accepted as the cost of the
# notification. Dedup is against open issues only, unlike a one-off event:
# drift is a recurring condition, so once an open report is resolved and
# closed, a fresh occurrence is news again and should file a new issue.
#
# Unlike td-tooling-drift.yml, scripts/check-supabase-auth-drift.mjs exits
# non-zero for both a genuine config disagreement and an operational
# failure (SUPABASE_ACCESS_TOKEN unset, a non-ok Management API response,
# an ALLOWLIST/config.toml mismatch) — it has no separate "drifted" output.
# The check step below runs with continue-on-error so later steps can gate
# on its outcome, and the issue uses one neutral title covering both cases:
# a title asserting "has drifted" would be wrong for a token or API
# failure, and a title that varies with the cause would break dedup. The
# captured log in the issue body is what tells a reader which happened.
#
# The filing step is the first in this repository to paste captured script
# output into an issue, and the repository is public. Two consequences are
# deliberate. A drift report prints the live value of every drifted key —
# the side that is not in the repo — but the check step already tees the
# same report into the run log, which on a public repository anyone can
# read, so the issue adds only permanence and discoverability to an
# exposure the Actions tab grants anyway; and without the live values the
# report would not tell a reader what needs deciding. And the body is unbounded against GitHub's
# 65536-character issue-body cap, which only a pathological Management API
# response could reach: that path fails safe — `gh issue create` rejects
# the body, the step and run go red — so a truncation guard would buy
# nothing. One thing is not left to chance: the filing step strips
# SUPABASE_ACCESS_TOKEN from the log before publishing, because Actions
# secret masking covers only the run log, and the script's discipline of
# never printing the token is enforced nowhere the publishing step can see.

on:
  schedule:
    - cron: "27 6 * * *" # daily, 06:27 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check Supabase auth-config drift
        id: drift
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          node scripts/check-supabase-auth-drift.mjs 2>&1 | tee /tmp/auth-drift.log

      - name: File an issue if the check failed
        if: steps.drift.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Supabase auth-config drift check is failing"

          # Dedup on open issues only: drift is a recurring condition, so
          # once an open report is resolved and closed, a fresh occurrence
          # is news again and should file a new issue.
          already_filed=$(gh issue list --state open --limit 200 --json title \
            | jq --arg title "$title" 'any(.[]; .title == $title)')
          if [ "$already_filed" = "true" ]; then
            echo "Already reported; skipping."
            exit 0
          fi

          # Secret masking does not reach an issue body, so enforce the
          # token's absence here, at the step that publishes, rather than
          # trusting every future error path in the script.
          log=$(cat /tmp/auth-drift.log)
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            log=${log//"$SUPABASE_ACCESS_TOKEN"/"***"}
          fi

          body_file=$(mktemp)
          {
            printf '`scripts/check-supabase-auth-drift.mjs` failed. This '
            printf 'means either a genuine disagreement between '
            printf '`supabase/config.toml` and the live project'"'"'s '
            printf 'auth settings, or an operational failure (an unset '
            printf '`SUPABASE_ACCESS_TOKEN`, a non-ok Management API '
            printf 'response). The captured output below tells you which:\n\n'
            printf '```\n'
            printf '%s\n' "$log"
            printf '\n```\n\n'
            printf 'Run: %s\n' "$RUN_URL"
          } > "$body_file"
          gh issue create --title "$title" --body-file "$body_file"

      - name: Fail if the check failed
        if: steps.drift.outcome == 'failure'
        run: exit 1
